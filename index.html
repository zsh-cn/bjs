<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BJS 北京时间 —— 通过中国科学院国家授时中心 NTP 服务校准的实时北京时间。">
  <meta name="theme-color" content="#f5f4f0" id="theme-color">
  <title>BJS · 北京时间</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('bjs-theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (dark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0b0e' : '#f5f4f0');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="BJS 北京时间首页">
      <span class="brand-mark" aria-hidden="true">B</span>
      <span class="brand-name">BJS<span class="brand-sub">北京时间</span></span>
    </a>

    <div class="actions">
      <div class="status" id="status" data-state="syncing" role="status" aria-live="polite" title="正在连接授时服务">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text">正在校准</span>
      </div>

      <button class="icon-btn fmt-btn" id="hour-toggle" type="button" aria-label="切换为 12 小时制" aria-pressed="false" title="切换为 12 小时制">
        <span class="fmt-label" id="hour-toggle-label">24H</span>
      </button>

      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色主题" title="切换主题">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.6"/>
          <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 14.4A8.4 8.4 0 0 1 9.6 3.8 8.4 8.4 0 1 0 20.2 14.4Z"/>
        </svg>
      </button>

      <button class="icon-btn" id="sync-btn" type="button" aria-label="立即同步时间" title="立即同步">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 0 0-14.9-3M4 4.5V9h4.5"/>
          <path d="M4 13a8 8 0 0 0 14.9 3M20 19.5V15h-4.5"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="clock" aria-label="当前北京时间">
      <p class="eyebrow">
        <span class="eyebrow-line" aria-hidden="true"></span>
        Beijing Standard Time
        <span class="eyebrow-line" aria-hidden="true"></span>
      </p>

      <div class="time" role="timer" aria-live="off" aria-atomic="true">
        <span class="time-main" id="clock-main">--:--:--</span>
        <span class="time-ms" id="clock-ms">.---</span>
        <span class="time-meridiem" id="clock-meridiem" hidden></span>
      </div>

      <div class="seconds" aria-hidden="true">
        <span class="seconds-fill" id="seconds-fill"></span>
      </div>

      <p class="date">
        <span id="date-text">—</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="weekday-text">—</span>
      </p>
      <p class="zone">UTC+8 <span class="sep" aria-hidden="true">/</span> Asia/Shanghai</p>
    </section>

    <section class="facts" aria-label="授时状态">
      <div class="fact">
        <span class="fact-label">时间源</span>
        <span class="fact-value" id="fact-source">正在连接…</span>
      </div>
      <div class="fact">
        <span class="fact-label">时钟偏差</span>
        <span class="fact-value mono" id="fact-offset">—</span>
      </div>
      <div class="fact">
        <span class="fact-label">网络往返</span>
        <span class="fact-value mono" id="fact-rtt">—</span>
      </div>
      <div class="fact">
        <span class="fact-label">上次同步</span>
        <span class="fact-value mono" id="fact-last">—</span>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="hint" id="hint" hidden>
      未连接授时服务，当前显示本机时钟。静态页面无法直接使用 NTP，请运行 <code>node server.mjs</code> 后访问
      <code>http://127.0.0.1:8787</code>。
    </p>
    <div class="footer-row">
      <p class="credit"><span class="credit-dot" aria-hidden="true"></span>时间基准 <strong id="credit-name">NTSC</strong> <span id="credit-tail">· 中国科学院国家授时中心</span></p>
      <div class="footer-clocks">
        <p class="device" id="device-clock" hidden></p>
        <p class="utc" id="utc-clock" title="协调世界时（UTC）">
          <span class="utc-label">UTC</span>
          <span class="utc-time" id="utc-time">--:--:--</span>
        </p>
      </div>
    </div>
  </footer>

  <script src="js/config.js" defer></script>
  <script src="js/time.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
